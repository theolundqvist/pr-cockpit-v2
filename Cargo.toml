[workspace]
members = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.dependencies]
ammonia = "4.1.2"
anyhow = "1.0.100"
comrak = "0.48.0"
git2 = { version = "0.20.2", default-features = false, features = ["vendored-openssl", "https"] }
keyring = "3.6.3"
notify = "8.2.0"
octocrab = "0.50.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "gzip", "brotli", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tauri = { version = "2.11.2", features = [] }
tauri-build = { version = "2.6.2", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-os = "2.3.2"
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tree-sitter = "0.25.10"
tree-sitter-highlight = "0.25.10"
zstd = "0.13.3"
