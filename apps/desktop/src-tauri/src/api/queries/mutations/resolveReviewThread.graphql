mutation ResolveReviewThread($threadId: ID!) {
  resolveReviewThread(input: { threadId: $threadId }) {
    thread {
      id
      path
      line
      side
      startLine
      startSide
      isOutdated
      isResolved
      updatedAt
      resolvedBy {
        ... on User {
          id
        }
      }
    }
  }
}
