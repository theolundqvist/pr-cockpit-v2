[package]
name = "pr-cockpit-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "pr_cockpit_desktop"
path = "src/lib.rs"

[dependencies]
ammonia = "4.0.0"
anyhow = "1.0.100"
comrak = "0.29.0"
hex = "0.4.3"
kuchiki = "0.8.1"
once_cell = "1.21.3"
regex = "1.12.2"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.23.0"
