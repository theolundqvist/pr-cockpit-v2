[package]
name = "desktop"
version = "0.1.0"
description = "PR Cockpit desktop shell"
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "desktop"
path = "src/main.rs"

[[bin]]
name = "fixture-build"
path = "fixtures/build.rs"

[[bin]]
name = "generate-ipc-bindings"
path = "src/bin/generate_ipc_bindings.rs"

[[bin]]
name = "render_batch"
path = "src/bin/render_batch.rs"

[[bench]]
name = "inbox_first_paint"
harness = false

[[bench]]
name = "pr_detail_open"
harness = false

[[bench]]
name = "file_open_in_diff_cached"
harness = false

[[bench]]
name = "comrak_render_throughput"
harness = false

[[bench]]
name = "mutation_submit_visible"
harness = false

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
anyhow = { workspace = true }
octocrab = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
sqlx = { workspace = true }
tauri = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-specta = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-highlight = { workspace = true }
ammonia = { workspace = true }
comrak = { workspace = true }
git2 = { workspace = true }
keyring = { workspace = true }
notify = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true }
tempfile = "3.27.0"
chrono = "0.4.44"
hex = "0.4.3"
once_cell = "1.21.4"
regex = "1.12.2"
kuchiki = "0.8.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
chrono-tz = { workspace = true }

[dev-dependencies]
criterion = "0.8.2"
regex = "1.12.2"
wiremock = "0.6.5"
tokio = { workspace = true, features = ["test-util"] }
mockito = "1.7.2"
proptest = "1"
